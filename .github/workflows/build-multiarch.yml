name: Build Multi-Architecture Wheels

on:
  push:
    tags: [ 'v*' ]  # Trigger on version tags to create releases
  pull_request:
    branches: [ master, main ]  # Test builds on PRs
  workflow_dispatch:  # Allow manual trigger

env:
  CIBW_TEST_COMMAND: "python -c 'import _modes; print(\"Module loaded successfully\")'"
  CIBW_BUILD_VERBOSITY: 1

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} for ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds for Raspberry Pi + development
          - os: ubuntu-latest
            arch: x86_64
            platform_id: linux_x86_64
          - os: ubuntu-latest
            arch: aarch64
            platform_id: linux_aarch64
          - os: ubuntu-latest
            arch: armv7l
            platform_id: linux_armv7l

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cibuildwheel build

    # Setup QEMU for cross-compilation on Linux
    - name: Set up QEMU
      if: matrix.os == 'ubuntu-latest' && matrix.arch != 'x86_64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all

    - name: Build wheels
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        # Build for Python 3.9, 3.11, 3.12 (Raspberry Pi OS compatibility)
        CIBW_BUILD: cp39-* cp311-* cp312-*
        CIBW_SKIP: "*-win32 *-musllinux_*"
        # Architecture-specific optimizations
        CIBW_ENVIRONMENT: >
          TARGET_ARCH=${{ matrix.arch }}
          OPTIMIZE_NATIVE=0
        # Before build setup
        CIBW_BEFORE_BUILD: >
          pip install --upgrade pip setuptools wheel &&
          python -c "import platform; print(f'Building for {platform.machine()} on {platform.system()}')" &&
          yum install -y gcc gcc-c++ || apt-get update && apt-get install -y build-essential
        # Test imports work
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: "python -c 'import _modes; print(\"SUCCESS: _modes module imported\")'"
      run: cibuildwheel --output-dir wheelhouse

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.platform_id }}
        path: ./wheelhouse/*.whl
        retention-days: 30

  build_source:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build source distribution
      run: python -m build --sdist

    - name: Upload source distribution
      uses: actions/upload-artifact@v4
      with:
        name: source-dist
        path: dist/*.tar.gz
        retention-days: 30

  test_wheels:
    name: Test wheels
    needs: [build_wheels]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download wheels
      uses: actions/download-artifact@v4
      with:
        name: wheels-linux_x86_64
        path: wheelhouse

    - name: Install wheel
      run: |
        pip install --find-links wheelhouse MlatClient
        python -c "import _modes; print('SUCCESS: Module imported correctly')"

  create_release:
    name: Create GitHub Release
    needs: [build_wheels, build_source, test_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # Required for creating releases

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all wheel artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        path: release-assets
        merge-multiple: true

    - name: Download source distribution
      uses: actions/download-artifact@v4
      with:
        name: source-dist
        path: release-assets

    - name: List release assets
      run: ls -la release-assets/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*
        draft: false
        prerelease: false
        generate_release_notes: true
        fail_on_unmatched_files: true

